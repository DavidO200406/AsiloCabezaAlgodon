{% extends "base.html" %}

{% block titulo %}Registrar gasto | Asilo Cabeza de Algodón{% endblock %}

{% block contenido %}
<div class="contenido-principal">

    <div class="encabezado-pagina">
        <div>
            <h1>Registrar gasto</h1>
            <p>Ingresa los datos del gasto realizado por el asilo.</p>
        </div>

        <a href="{{ url_for('finanzas_gastos') }}" class="boton-secundario">
            Volver a gastos
        </a>
    </div>

    <section class="seccion-panel formulario-panel">

        <form method="POST" action="{{ url_for('finanzas_gasto_nuevo') }}">

            <div class="formulario-datos">

                <div class="campo-formulario">
                    <label for="fecha_gasto">Fecha del gasto</label>
                    <input type="date" id="fecha_gasto" name="fecha_gasto"
                        value="{{ gasto.get('fecha_gasto', fecha_hoy) }}" required>
                </div>

                <div class="campo-formulario">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Selecciona una categoría</option>

                        {% for categoria in categorias %}
                        <option value="{{ categoria }}" {% if gasto.get('categoria', '' )==categoria %}selected{% endif
                            %}>
                            {{ categoria }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="descripcion">Descripción</label>
                    <input type="text" id="descripcion" name="descripcion" value="{{ gasto.get('descripcion', '') }}"
                        maxlength="255" placeholder="Ej. Compra de alimentos" required>
                </div>

                <div class="campo-formulario">
                    <label for="monto">Monto del gasto (Q)</label>
                    <input type="number" id="monto" name="monto" min="0.01" max="99999999.99" step="0.01"
                        value="{{ gasto.get('monto', '') }}" placeholder="Ej. 350.00" required>
                </div>

                <div class="campo-formulario">
                    <label for="proveedor">Proveedor (opcional)</label>
                    <input type="text" id="proveedor" name="proveedor" value="{{ gasto.get('proveedor', '') }}"
                        placeholder="Nombre del proveedor">
                </div>

                <div class="campo-formulario">
                    <label for="referencia">Referencia (opcional)</label>
                    <input type="text" id="referencia" name="referencia" value="{{ gasto.get('referencia', '') }}"
                        placeholder="Número de factura o recibo">
                </div>

                <div class="campo-formulario">
                    <label for="observaciones">Observaciones (opcional)</label>
                    <textarea id="observaciones" name="observaciones" rows="4"
                        placeholder="Detalles adicionales">{{ gasto.get('observaciones', '') }}</textarea>
                </div>

            </div>

            <div class="acciones-formulario">
                <button type="submit" class="boton-accion">
                    Guardar gasto
                </button>

                <a href="{{ url_for('finanzas_gastos') }}" class="boton-secundario">
                    Cancelar
                </a>
            </div>

        </form>

    </section>
</div>
{% endblock %}
